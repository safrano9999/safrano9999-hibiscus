# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: safrano9999-hibiscus container image
run-name: ${{ inputs.monitor_id != '' && format('{0} [monitor:{1}:{2}]', github.workflow, inputs.monitor_id, inputs.monitor_final) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish. Empty uses YYYY.M.D."
        required: false
        default: ""
      push_latest:
        description: "Also publish :latest"
        required: true
        type: boolean
        default: true
      monitor_id:
        description: "Optional event-monitor correlation id"
        required: false
        default: ""
        type: string
      monitor_final:
        description: "This run is the final monitored cascade stage"
        required: true
        default: true
        type: boolean

concurrency:
  group: safrano9999-hibiscus-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE_NAME: ghcr.io/safrano9999/safrano9999-hibiscus
      HIBISCUS_MCP_REF: a632325b38b4c8846fb1679821db787284ce5463
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check out standalone-capable MCP source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: safrano9999/HIBISCUS_MCP
          ref: ${{ env.HIBISCUS_MCP_REF }}
          path: build/mcp-source
          fetch-depth: 1
          persist-credentials: false

      - name: Record MCP source
        id: mcp
        shell: bash
        run: echo "commit=$(git -C build/mcp-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Reuse ucore's exact approved compose, checksum verifier and manifest pin.
      - name: Check out pinned Fedora Beta policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: safrano9999/fedora45-ai-safrano9999
          ref: 49b5f4c1cfc257a80a8a739b2c0bc32dab32e00f
          path: build/fedora-policy
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/prepare-fedora-beta.py
            /upgrade-loop/build_dependencies.py
            /upgrade-loop/build-dependencies-whitelist.json
            /fedora45-ai-core-pre/Containerfile

      - name: Verify approved Fedora Beta OCI context
        id: fedora
        run: python3 build/fedora-policy/.github/scripts/prepare-fedora-beta.py

      - name: Resolve image tags
        id: tags
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          version="$IMAGE_TAG"
          if [ -z "$version" ]; then
            version="$(date -u +%Y.%-m.%-d)"
          fi
          [[ "$version" =~ ^[A-Za-z0-9_.-]+$ ]]
          {
            echo "version=$version"
            echo "candidate=${IMAGE_NAME}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build candidate safrano9999-hibiscus
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/scripts/Containerfile
          platforms: linux/amd64
          build-contexts: ${{ steps.fedora.outputs.context }}
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.tags.outputs.candidate }}
          labels: |
            io.safrano9999.build.commit=${{ github.sha }}
            io.safrano9999.hibiscus-mcp.commit=${{ steps.mcp.outputs.commit }}

      - name: Smoke-test candidate image
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}@${CANDIDATE_DIGEST}"
          docker pull "$image"
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$image")" = '["/sbin/init"]'
          docker run --rm --entrypoint /bin/bash "$image" -lc '
            set -euo pipefail
            test -f /usr/local/hibiscus/plugins/hibiscus/lib/hbci4j-core-4.1.17.jar
            node --check /opt/hibiscus-mcp/server.mjs
            systemd-analyze verify safrano9999-hibiscus.service safrano9999-hibiscus-mcp.service safrano9999-hibiscus.target
            java --version
          '

      - name: Smoke-test MCP without banking access
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}@${CANDIDATE_DIGEST}"
          container_id="$(docker run -d --network none --user hibiscus-mcp \
            -e HIBISCUS_MCP_GATEWAY=ci-gateway \
            -e HIBISCUS_STORE_PASSWORD=ci-upstream \
            -e HIBISCUS_MCP_UPSTREAM_URL=http://127.0.0.1:18080 \
            --entrypoint /usr/bin/node "$image" /opt/supergateway/dist/index.js \
            --stdio '/usr/bin/node /opt/hibiscus-mcp/server.mjs' \
            --outputTransport streamableHttp --stateful --host 0.0.0.0 --port 8000 \
            --streamableHttpPath /mcp --healthEndpoint /healthz --sessionTimeout 3600000)"
          trap 'docker rm -fv "$container_id" >/dev/null 2>&1 || true' EXIT
          docker exec -i "$container_id" node --input-type=module \
            < .github/scripts/mcp-protocol-smoke.mjs

      - name: Test VoP defaults WebUI XML-RPC and MCP with an isolated empty profile
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}@${CANDIDATE_DIGEST}"
          probe_dir="$(mktemp -d)"
          javac --release 17 -d "$probe_dir" .github/scripts/VoPDefaultProbe.java
          printf 'Premain-Class: VoPDefaultProbe\n' > "$probe_dir/MANIFEST.MF"
          jar --create --file "$probe_dir/vop-default-probe.jar" \
            --manifest "$probe_dir/MANIFEST.MF" -C "$probe_dir" VoPDefaultProbe.class
          container_id="$(docker run -d --network none --entrypoint /usr/bin/sleep "$image" infinity)"
          trap 'docker rm -fv "$container_id" >/dev/null 2>&1 || true; rm -rf "$probe_dir"' EXIT
          docker cp "$probe_dir/vop-default-probe.jar" "$container_id:/tmp/vop-default-probe.jar"
          docker exec -i "$container_id" node --input-type=module \
            < .github/scripts/server-api-smoke.mjs

      - name: Promote verified image
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.tags.outputs.version }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          tags=(--tag "${IMAGE_NAME}:${IMAGE_TAG}")
          if [ "$PUSH_LATEST" = true ]; then tags+=(--tag "${IMAGE_NAME}:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${IMAGE_NAME}@${CANDIDATE_DIGEST}"
          {
            echo "Hibiscus 2.12.4 / HBCI4Java 4.1.17 / Fedora 45 Beta-1.3"
            echo "Image: ${IMAGE_NAME}:${IMAGE_TAG}"
            echo "Digest: ${CANDIDATE_DIGEST}"
            echo "Java API linkage, VoP default/explicit overrides, MCP protocols, WebUI and XML-RPC verified without bank access."
          } >> "$GITHUB_STEP_SUMMARY"
