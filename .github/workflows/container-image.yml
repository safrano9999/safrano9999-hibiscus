# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: HIBISCUS-FEDORA45 container image
run-name: ${{ inputs.monitor_id != '' && format('{0} [monitor:{1}:{2}]', github.workflow, inputs.monitor_id, inputs.monitor_final) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish. Empty uses YYYY.M.D."
        required: false
        default: ""
      push_latest:
        description: "Also publish :latest"
        required: true
        type: boolean
        default: true
      monitor_id:
        description: "Optional event-monitor correlation id"
        required: false
        default: ""
        type: string
      monitor_final:
        description: "This run is the final monitored cascade stage"
        required: true
        default: true
        type: boolean

concurrency:
  group: hibiscus-fedora45-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_NAME: ghcr.io/safrano9999/hibiscus-fedora45
      HIBISCUS_FEDORA45_MCP_IMAGE: ghcr.io/safrano9999/hibiscus-mcp@sha256:4062d1e0dbd0ce33c34a98f61661c3f9567be04fddda913271f2b54f06a9f659
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.image_tag }}"
          if [ -z "$version" ]; then
            version="$(date -u +%Y.%-m.%-d)"
          fi
          [[ "$version" =~ ^[A-Za-z0-9_.-]+$ ]]
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${version}"
            if [ "${{ inputs.push_latest }}" = true ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish HIBISCUS-FEDORA45
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/scripts/Containerfile
          platforms: linux/amd64
          build-args: |
            HIBISCUS_FEDORA45_MCP_IMAGE=${{ env.HIBISCUS_FEDORA45_MCP_IMAGE }}
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            io.safrano9999.build.commit=${{ github.sha }}
            io.safrano9999.build.source=99c1e4d5024a7f19b17f870cf9ba47afd260baab
            io.safrano9999.build.inputs=4b280b808165a7ddc6ef874813030ac3c4dec82ba4a7bc7a24f59732fd8f0282

      - name: Smoke-test published image
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${IMAGE_TAG}"
          docker pull "$image"
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$image")" = '["/sbin/init"]'
          docker run --rm --entrypoint /bin/bash "$image" -lc '
            set -euo pipefail
            test -f /usr/local/hibiscus/plugins/hibiscus/lib/hbci4j-core-4.1.13.jar
            node --check /opt/hibiscus-mcp/server.mjs
            systemd-analyze verify hibiscus-fedora45.service hibiscus-fedora45-mcp.service hibiscus-fedora45.target
            java --version
          '
